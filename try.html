<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nadin Amizah Card (Tailwind)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
        }
        .main-title {
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>
<body class="bg-[#f6d9c7] flex justify-center items-center min-h-screen p-4">

    <div class="relative bg-[#f0e6dd] rounded-[20px] shadow-2xl w-full max-w-[1200px] flex overflow-hidden">

        <div class="absolute top-5 right-5 flex gap-2.5 z-10">
            <div class="bg-white p-2.5 rounded-xl shadow-lg cursor-pointer transition-transform duration-200 hover:translate-y-[-2px]">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-5v4m0 0h-4m4 0l-5-5M4 16v4m0 0h4m-4 0l5-5m11 5v-4m0 0h-4m4 0l-5 5" />
                </svg>
            </div>
            <div class="bg-white p-2.5 rounded-xl shadow-lg cursor-pointer transition-transform duration-200 hover:translate-y-[-2px]">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.42 12H19v-5m-1.42.002a7.5 7.5 0 10-10.9-8.406" />
                </svg>
            </div>
        </div>

        <div class="relative flex-[3] p-10 flex flex-col justify-end min-h-[600px] md:min-h-0 md:p-10">
            <span class="absolute top-5 left-5 text-sm text-gray-500">Created by atsyah</span>
            <img class="absolute inset-0 w-full h-full object-cover rounded-[20px] shadow-md z-0" src="https://i.imgur.com/vHq0g2p.jpeg" alt="Nadin Amizah">
            <div class="relative z-10 bg-gradient-to-t from-[#f0e6dd] from-40% via-transparent to-transparent pt-32">
                <h1 class="main-title text-6xl font-extrabold text-[#4a4a4a] leading-none mb-4">NADIN<br>AMIZAH</h1>
                <p class="text-sm text-gray-500 leading-relaxed max-w-lg">Nadin Amizah adalah seorang penyanyi Indonesia yang lahir di Jakarta pada 28 Mei 2000. Wanita yang menginjak usia 22 tahun ini selain menjadi seorang penyanyi juga seorang penulis lagu dan influencer.</p>
            </div>
        </div>

        <div class="flex-[1] bg-white p-10 rounded-r-[20px] flex flex-col justify-around gap-5 md:flex-col">
            <div class="flex items-center gap-4 text-[#4a4a4a]">
                <span class="text-4xl font-bold text-gray-400">01</span>
                <span class="flex-grow text-lg font-medium">Sorai</span>
                <img class="w-20 h-20 rounded-xl object-cover shadow-md" src="https://i.imgur.com/uR5YQp5.jpeg" alt="Sorai thumbnail">
            </div>
            <div class="flex items-center gap-4 text-[#4a4a4a]">
                <span class="text-4xl font-bold text-gray-400">02</span>
                <span class="flex-grow text-lg font-medium">Bertaut</span>
                <img class="w-20 h-20 rounded-xl object-cover shadow-md" src="https://i.imgur.com/zWzX6c0.jpeg" alt="Bertaut thumbnail">
            </div>
            <div class="flex items-center gap-4 text-[#4a4a4a]">
                <span class="text-4xl font-bold text-gray-400">03</span>
                <span class="flex-grow text-lg font-medium">Taruh</span>
                <img class="w-20 h-20 rounded-xl object-cover shadow-md" src="https://i.imgur.com/oA2pS2M.jpeg" alt="Taruh thumbnail">
            </div>
        </div>

    </div>

</body>
</html>
