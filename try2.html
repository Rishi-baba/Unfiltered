<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nadin Amizah Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-bg-color: #f6d9c7;
            --container-bg-color: #f0e6dd;
            --shadow-color: rgba(0, 0, 0, 0.1);
            --main-text-color: #4a4a4a;
            --light-text-color: #999;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--primary-bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .card-container {
            display: flex;
            width: 100%;
            max-width: 1200px;
            background-color: var(--container-bg-color);
            border-radius: 20px;
            box-shadow: 0 15px 30px var(--shadow-color);
            overflow: hidden;
            position: relative;
        }

        /* --- Top Icons Section --- */
        .top-icons {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .icon-box {
            background-color: white;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .icon-box:hover {
            transform: translateY(-2px);
        }

        .icon-box svg {
            display: block;
            width: 20px;
            height: 20px;
            fill: var(--light-text-color);
        }
        
        /* --- Left Section (Main Content) --- */
        .left-section {
            flex: 3;
            position: relative;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            min-height: 600px;
            background-color: var(--container-bg-color);
        }

        .created-by {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 14px;
            color: var(--light-text-color);
        }

        .main-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
            border-radius: 20px;
            filter: drop-shadow(0 15px 20px rgba(0, 0, 0, 0.2));
            z-index: 1;
        }

        .text-content {
            position: relative;
            z-index: 2;
            padding-bottom: 20px;
            background: linear-gradient(to top, var(--container-bg-color) 0%, transparent 80%);
        }

        .main-title {
            font-family: 'Playfair Display', serif;
            font-size: 4em;
            color: var(--main-text-color);
            line-height: 1;
            margin: 0;
        }

        .description {
            font-size: 14px;
            color: var(--light-text-color);
            line-height: 1.6;
            margin-top: 20px;
            max-width: 450px;
        }
        
        /* --- Right Section (Song List) --- */
        .right-section {
            flex: 1;
            padding: 40px;
            background-color: white;
            border-top-right-radius: 20px;
            border-bottom-right-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            gap: 20px;
        }

        .song-item {
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--main-text-color);
        }

        .song-number {
            font-size: 2em;
            font-weight: bold;
            color: var(--light-text-color);
        }

        .song-info {
            flex-grow: 1;
            font-size: 1.1em;
            font-weight: 500;
        }

        .song-thumbnail {
            width: 80px;
            height: 80px;
            border-radius: 10px;
            object-fit: cover;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
        }

        /* --- Responsiveness --- */
        @media (max-width: 900px) {
            .card-container {
                flex-direction: column;
                align-items: center;
            }

            .left-section {
                width: 100%;
                min-height: 400px;
                padding-bottom: 200px; /* Adjust for text content below image */
            }

            .main-image {
                position: absolute;
                top: 0;
                left: 0;
                height: 100%;
                width: 100%;
                object-fit: cover;
                object-position: center top;
                border-bottom-left-radius: 0;
                border-bottom-right-radius: 0;
            }

            .text-content {
                position: absolute;
                bottom: 0;
                left: 0;
                width: 100%;
                padding: 20px;
                background: linear-gradient(to top, var(--container-bg-color) 40%, transparent 100%);
            }

            .main-title {
                font-size: 3em;
            }

            .right-section {
                width: 100%;
                border-radius: 20px;
                margin-top: -100px;
                box-shadow: 0 15px 30px var(--shadow-color);
            }
        }
    </style>
</head>
<body>
    <div class="card-container">
        <div class="top-icons">
            <div class="icon-box">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M7 10h-5v-5h5v5zm-5 11h5v-5h-5v5zm7-11h5v-5h-5v5zm7 0h5v-5h-5v5zm-7 11h5v-5h-5v5zm7 0h5v-5h-5v5zm-15-5h5v-5h-5v5zm11 0h5v-5h-5v5z"/></svg>
            </div>
            <div class="icon-box">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M13.5 2c-4.661 0-8.464 3.322-9.453 7.644l-4.047-1.744v10.1h10.1l-2.316-2.583c2.756-1.577 5.952-1.282 8.421.905 2.47 2.187 3.55 5.584 2.766 8.567h5.176c.928-3.194-.287-6.918-2.618-9.014-2.33-2.096-5.467-2.64-8.192-1.516l-1.397-1.558c2.956-1.898 6.643-2.28 9.947-.643 3.303 1.637 5.86 4.774 6.945 8.472h-5.286c-.928-3.194.287-6.918 2.618-9.014 2.33-2.096 5.467-2.64 8.192-1.516l1.397-1.558c-2.956-1.898-6.643-2.28-9.947-.643-3.303-1.637-5.86-4.774-6.945-8.472z"/></svg>
            </div>
        </div>

        <div class="left-section">
            <span class="created-by">Created by atsyah</span>
            <img class="main-image" src="https://i.imgur.com/vHq0g2p.jpeg" alt="Nadin Amizah">
            <div class="text-content">
                <h1 class="main-title">NADIN<br>AMIZAH</h1>
                <p class="description">Nadin Amizah adalah seorang penyanyi Indonesia yang lahir di Jakarta pada 28 Mei 2000. Wanita yang menginjak usia 22 tahun ini selain menjadi seorang penyanyi juga seorang penulis lagu dan influencer.</p>
            </div>
        </div>

        <div class="right-section">
            <div class="song-item">
                <span class="song-number">01</span>
                <span class="song-info">Sorai</span>
                <img class="song-thumbnail" src="https://i.imgur.com/uR5YQp5.jpeg" alt="Sorai thumbnail">
            </div>
            <div class="song-item">
                <span class="song-number">02</span>
                <span class="song-info">Bertaut</span>
                <img class="song-thumbnail" src="https://i.imgur.com/zWzX6c0.jpeg" alt="Bertaut thumbnail">
            </div>
            <div class="song-item">
                <span class="song-number">03</span>
                <span class="song-info">Taruh</span>
                <img class="song-thumbnail" src="https://i.imgur.com/oA2pS2M.jpeg" alt="Taruh thumbnail">
            </div>
        </div>
    </div>
    
    <script>
        // Optional JavaScript for interactivity (e.g., hover effects)
        const iconBoxes = document.querySelectorAll('.icon-box');
        iconBoxes.forEach(box => {
            box.addEventListener('click', () => {
                alert('Icon clicked!');
            });
        });
    </script>
</body>
</html>
